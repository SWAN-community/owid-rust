[package]
name = "owid"
version = "2.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Simple cryptographically auditable identifiers and processors implemented in Rust."
repository = "https://github.com/SWAN-community/owid-rust"
keywords = ["owid", "swan", "identifier", "audit", "signature"]
categories = ["cryptography", "encoding"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
# The tests drive the asynchronous key fetch on a current thread runtime.
# The crate itself needs no runtime.
tokio = { version = "1", features = ["rt", "macros"] }

[features]
default = []
# Helpers for hosting the well known end points required by the OWID
# specification.
endpoints = ["dep:serde", "dep:serde_json"]
# Verification that fetches the creator public key from the well known end
# point through a transport the caller supplies. Adds no dependency and
# builds for WebAssembly targets, where the host environment provides HTTP.
fetch = []
# A ready made transport over asynchronous reqwest with rustls, which never
# follows a redirect. Not for WebAssembly targets.
reqwest-fetch = ["fetch", "dep:reqwest"]

[package.metadata.docs.rs]
all-features = true
